(function(){

    // Smart Account routing: guest -> auth page, logged-in -> dashboard
    var hasTok=function(){ try{return !!(localStorage.getItem('sm_user_token')||sessionStorage.getItem('sm_user_token'));}catch(x){return false;} };
    if(!hasTok()) document.querySelectorAll('[data-account-link]').forEach(function(a){ a.href='auth.html?next='+encodeURIComponent('dashboard.html'); });
  }catch(e){}
  // click-time re-check (token may change without reload)
  document.addEventListener('click',function(e){
    var a=e.target&&e.target.closest?e.target.closest('[data-account-link]'):null;
    if(!a) return;
    var t=''; try{t=localStorage.getItem('sm_user_token')||sessionStorage.getItem('sm_user_token')||'';}catch(x){}
    if(!t){ e.preventDefault(); location.href='auth.html?next='+encodeURIComponent('dashboard.html'); }
  });
})();
</script>

<script>
document.getElementById('menuBtn').addEventListener('click',()=>document.getElementById('mobileMenu').classList.toggle('hidden'));
function scrollRow(id,amt){const el=document.getElementById(id);if(el)el.scrollBy({left:amt,behavior:'smooth'})}

/* ===== Dynamic ebook-batches + per-batch category summary (courses.html same design/logic, e-book version) ===== */
function dynEsc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function ebBatchIcon(b){
  const n=(b.name||'').toLowerCase();
  if(n.includes('skill')) return 'fa-briefcase';
  if(n.includes('ssc')||n.includes('hsc')||n.includes('admission')) return 'fa-book-open';
  return 'fa-book-open';
}
const CAT_STYLES=[
  {box:'cat-academic',icon:'fa-layer-group',iconCls:'text-[#3B5BFE]',pill:'bg-[#DDD6FE] text-[#4F46E5]',hover:'hover:bg-[#1A56FF]'},
  {box:'cat-revision',icon:'fa-bullseye',iconCls:'text-[#16A34A]',pill:'bg-[#C8E9D5] text-[#15803D]',hover:'hover:bg-[#16A34A]'},
  {box:'cat-admission',icon:'fa-building-columns',iconCls:'text-[#F59E0B]',pill:'bg-[#FFE4C7] text-[#C2410C]',hover:'hover:bg-[#F59E0B]'}
];
function catStyle(name,idx){
  const n=(name||'').toLowerCase();
  if(n.includes('academic')) return CAT_STYLES[0];
  if(n.includes('revision')) return CAT_STYLES[1];
  if(n.includes('admission')) return CAT_STYLES[2];
  return CAT_STYLES[idx%3];
}

function ebCard(b){
  const color=b.ebookBatchColor||b.batchColor||'#0EA5E9';
  const grad='linear-gradient(135deg,'+dynEsc(color)+' 0%,#0F2043 100%)';
  const cover=b.cover
    ? '<img src="'+dynEsc(b.cover)+'" alt="'+dynEsc(b.title)+'" class="w-full h-full object-cover" loading="lazy">'
    : '<div class="w-full h-full flex items-center justify-center" style="background:'+grad+'"><span class="text-white/90 text-[11px] sm:text-[13px] font-extrabold px-2 sm:px-3 text-center leading-tight">'+dynEsc(b.ebookBatchName||b.batchName||'E-Book')+'</span></div>';
  const price=Number(b.price)||0, old=Number(b.oldPrice)||0;
  const off=old>price&&price>0?Math.round(((old-price)/old)*100):0;
  const priceHtml=price>0
    ? '<span class="text-[11px] sm:text-[14px] font-extrabold text-[#0F2043]">৳'+price+'</span>'+(old>price?'<span class="hidden sm:inline text-[11px] text-slate-400 line-through ml-1">৳'+old+'</span>':'')
    : '<span class="text-[11px] sm:text-[14px] font-extrabold text-[#16A34A]">FREE</span>';
  const batchPill=(b.ebookBatchName||b.batchName)?'<span class="hidden sm:inline-block px-2 py-0.5 rounded-full bg-[#E0F2FE] text-[#0284C7] text-[10px] font-bold truncate">'+dynEsc(b.ebookBatchName||b.batchName)+'</span>':'';
  const offPill=off?'<span class="px-1 sm:px-2 py-0.5 rounded-full bg-[#E6F4EA] text-[#16A34A] text-[8px] sm:text-[10px] font-bold flex-shrink-0">-'+off+'%</span>':'';
  const isFree = !(price>0);
  return '<div class="bg-white rounded-[10px] sm:rounded-[14px] border border-slate-100 shadow-sm hover:shadow-md transition overflow-hidden flex flex-col">'
    +'<a href="ebook.html?id='+b.id+'" class="block"><div class="aspect-[4/3] w-full relative overflow-hidden bg-[#0F2043]">'+cover
    +'<span class="absolute top-1 left-1 sm:top-2 sm:left-2 px-1 sm:px-2 py-0.5 rounded-full bg-black/45 backdrop-blur border border-white/25 text-white text-[7px] sm:text-[10px] font-bold truncate max-w-[calc(100%-12px)]"><i class="fa-solid fa-file-pdf mr-1"></i>'+dynEsc(b.ebookBatchName||b.batchName||'E-Book')+'</span>'
    +(isFree?'':'')+'</div></a>'
    +'<div class="p-1 sm:p-3 flex flex-col flex-1">'
    +'<div class="flex items-center gap-1 mb-0.5 sm:mb-1.5 flex-wrap">'+batchPill+offPill+'</div>'
    +'<a href="ebook.html?id='+b.id+'" class="text-[10px] sm:text-[13px] font-bold text-[#0F2043] leading-snug hover:text-[#1A56FF] line-clamp-2 min-h-[28px] sm:min-h-0">'+dynEsc(b.title)+'</a>'
    +'<p class="hidden sm:block text-[11px] text-slate-500 mt-1 truncate">'+dynEsc(b.author?('By '+b.author):(b.categoryName||''))+'</p>'
    +'<div class="mt-auto pt-1 sm:pt-3 flex items-center justify-between gap-1 flex-wrap"><div class="min-w-0 flex items-baseline gap-1">'+priceHtml+'</div>'
    +(isFree
      ? '<a href="ebook.html?id='+b.id+'" class="px-1.5 py-0.5 sm:px-3 sm:py-1.5 rounded-full bg-[#EEF2FF] text-[#1A56FF] text-[8px] sm:text-[11px] font-bold whitespace-nowrap w-full sm:w-auto text-center">View <i class="fa-solid fa-arrow-right text-[7px] ml-0.5"></i></a>'
      : '<div class="flex items-center gap-1 flex-shrink-0 w-full sm:w-auto"><button data-sm-add="'+b.id+'" data-sm-kind="ebook" onclick="event.stopPropagation()" title="Add to cart" class="w-5 h-5 sm:w-8 sm:h-8 rounded-full bg-[#EEF2FF] flex items-center justify-center hover:bg-[#1A56FF] hover:text-white text-[#1A56FF] transition flex-shrink-0"><i class="fa-solid fa-cart-shopping text-[9px] sm:text-[12px]"></i></button><button data-sm-buy="'+b.id+'" data-sm-kind="ebook" onclick="event.stopPropagation()" class="flex-1 sm:flex-none px-1.5 py-0.5 sm:px-3 sm:py-1.5 rounded-full bg-[#1A56FF] hover:bg-[#1445D6] text-white text-[8px] sm:text-[11px] font-bold whitespace-nowrap text-center">Buy Now</button></div>')
    +'</div></div></div>';
}

function ebMatchesParams(b, fBatch, fCat, fQ){
  if(fBatch){
    const okEb=String(b.ebookBatchSlug||'').toLowerCase()===String(fBatch).toLowerCase()||String(b.ebookBatchId||'')===String(fBatch);
    const okOld=String(b.batchSlug||'').toLowerCase()===String(fBatch).toLowerCase()||String(b.batchId||'')===String(fBatch);
    if(!okEb&&!okOld) return false;
  }
  if(fCat){
    if(String(b.categorySlug||'').toLowerCase()!==String(fCat).toLowerCase()&&String(b.categoryName||'').toLowerCase()!==String(fCat).toLowerCase()) return false;
  }
  if(fQ){
    const t=(String(fQ)||'').toLowerCase();
    if(((b.title||'')+' '+(b.author||'')+' '+(b.categoryName||'')).toLowerCase().indexOf(t)===-1) return false;
  }
  return true;
}

async function loadEbookPage(){
  const secsEl=document.getElementById('ebBatchSections');
  const gridEl=document.getElementById('allEbooksGrid');
  const qs=new URLSearchParams(window.location.search);
  const fBatch=(qs.get('ebookBatch')||qs.get('batch')||'').trim();
  const fCat=(qs.get('category')||'').trim();
  const fQ=(qs.get('q')||'').trim();
  try{
    const unwrap=j=>Array.isArray(j)?j:(j&&Array.isArray(j.data)?j.data:[]);
    // instant: server-injected catalog (zero network), then background revalidate
    try {
      var __cc = window.__SM_BOOTSTRAP__ && window.__SM_BOOTSTRAP__.catalog;
      if (__cc && Array.isArray(__cc.ebookBatches) && Array.isArray(__cc.ebooks)) {
        paintAllEb(__cc.ebookBatches, __cc.categories || [], __cc.ebooks, fBatch, fCat, fQ);
        secsEl._smKey='cat:'+__cc.ebookBatches.length+':'+__cc.ebooks.length;
      }
    } catch (e) {}
    const [ebBatches,cats,ebooks]=await Promise.all([
      fetch('/api/public/ebook-batches').then(r=>r.json()).then(unwrap),
      fetch('/api/public/categories').then(r=>r.json()).then(unwrap),
      fetch('/api/public/ebooks?limit=200').then(r=>r.json()).then(unwrap)
    ]);
    var __k='ebcat:'+ebBatches.length+':'+(cats||[]).length+':'+ebooks.length+':'+JSON.stringify((ebooks||[]).slice(0,20).map(c=>c.id));
    if(secsEl._smKey!==__k) paintAllEb(ebBatches, cats, ebooks, fBatch, fCat, fQ);
    secsEl._smKey=__k;
  }catch(e){
    if(!secsEl._smKey){
      secsEl.innerHTML='<p class="text-[13px] text-red-400 text-center py-4">Failed to load e-book batches</p>';
      if(gridEl) gridEl.innerHTML='<p class="col-span-full text-[13px] text-red-400 text-center py-8">Failed to load e-books</p>';
    }
  }
}

function paintAllEb(ebBatches, cats, ebooks, fBatch, fCat, fQ){
  const secsEl=document.getElementById('ebBatchSections');
  const gridEl=document.getElementById('allEbooksGrid');
  const titleEl=document.getElementById('allEbTitle');
  if(!secsEl) return;
  const activeBatches=(Array.isArray(ebBatches)?ebBatches:[]).filter(b=>b.status!=='inactive'&&b.status!=='archived').sort((a,b)=>((Number(a.order)||999)-(Number(b.order)||999))||(Number(a.id)-Number(b.id)));
  const catById={};(Array.isArray(cats)?cats:[]).forEach(c=>{catById[c.id]=c.name||'General'});

  // enrich fallback names (catalog lite may miss categoryName)
  const listAll=(Array.isArray(ebooks)?ebooks:[]).filter(e=>e.status!=='inactive').map(function(e){
    if(!e.categoryName&&e.categoryId&&catById[e.categoryId]) e.categoryName=catById[e.categoryId];
    return e;
  });

  // --- Per-ebookBatch summary sections: 3 columns on mobile (courses.html same) ---
  const isFiltered=!!(fBatch||fCat||fQ);
  if(isFiltered){
    secsEl.innerHTML='';
  } else {
    secsEl.innerHTML=activeBatches.map((b,bi)=>{
      const slug=dynEsc(b.slug||b.id);
      const list=listAll.filter(e=>String(e.ebookBatchId)===String(b.id)||String(e.batchId)===String(b.id));
      const groups={};const order=[];
      list.forEach(e=>{const cn=e.categoryName||catById[e.categoryId]||'General';if(!groups[cn]){groups[cn]=0;order.push(cn)}groups[cn]++});
      const cols=Math.max(1,Math.min(order.length||1,5));
      const isMulti=order.length>4;
      const cards=order.length?order.map((cn,ci)=>{
        const st=catStyle(cn,ci);const n=groups[cn];
        const catParam=encodeURIComponent(cn);
        return '<a href="ebbatch.html?ebookBatch='+slug+'&category='+catParam+'" class="group '+st.box+' rounded-[10px] sm:rounded-[20px] p-1.5 sm:p-6 flex flex-col items-center justify-center text-center transition-all duration-200 active:scale-[0.98] hover:shadow-lg hover:-translate-y-1 hover:ring-2 hover:ring-[#1A56FF]/20 w-full min-h-[72px] sm:min-h-[176px] '+(isMulti?'w-[calc(25%-9px)] min-w-[150px] flex-shrink-0 snap-start':'')+'">'
          +'<div class="w-7 h-7 sm:w-14 sm:h-14 rounded-xl bg-white flex items-center justify-center shadow-sm ring-1 ring-black/5 group-hover:scale-110 transition-transform"><i class="fa-solid '+st.icon+' '+st.iconCls+' text-[12px] sm:text-[24px]"></i></div>'
          +'<h3 class="mt-1 sm:mt-3 font-extrabold text-[9px] sm:text-[15px] leading-snug text-[#0F2043] line-clamp-2">'+dynEsc(cn)+'</h3></a>';
      }).join(''):'<p class="col-span-full text-[12px] text-slate-400 py-4 text-center">No e-books in this batch yet</p>';

      const dots=order.length>1?'<div class="flex justify-center gap-1.5 mt-2.5">'+order.slice(0,Math.min(order.length,5)).map((_,di)=>'<span class="'+(di===0?'w-3.5 bg-[#1A56FF]':'w-1.5 bg-slate-200')+' h-1.5 rounded-full transition-all"></span>').join('')+'</div>':'';
      const containerClass=isMulti
        ? 'flex gap-2 sm:gap-4 overflow-x-auto scrollbar-hide snap-x course-scroll pb-1'
        : 'grid grid-cols-4 sm:grid-cols-'+cols+' gap-1.5 sm:gap-4';

      return '<section id="ebbatch-'+slug+'" class="'+(bi===0?'mt-3 sm:mt-5':'mt-3 sm:mt-4')+' bg-white rounded-[16px] border border-slate-100/90 shadow-xs p-2.5 sm:p-4">'
        +'<div class="flex items-center justify-between mb-2 sm:mb-3"><div class="flex items-center gap-2 sm:gap-2.5">'
        +'<div class="w-7 h-7 sm:w-9 sm:h-9 rounded-full bg-[#E0F2FE] flex items-center justify-center flex-shrink-0"><i class="fa-solid '+ebBatchIcon(b)+' text-[#0284C7] text-[13px] sm:text-[16px]"></i></div>'
        +'<h2 class="text-[15px] sm:text-[19px] font-extrabold text-[#0F2043]">'+dynEsc(b.name||'Batch')+'</h2></div>'
        +'<a href="ebbatch.html?ebookBatch='+slug+'" class="text-[#1A56FF] font-bold text-[11px] sm:text-[13px] flex items-center gap-1 hover:underline">View All <i class="fa-solid fa-arrow-right text-[10px]"></i></a></div>'
        +'<div class="relative"><button onclick="scrollRow(\'ebrow-'+slug+'\',-240)" class="hidden sm:flex absolute -left-3.5 top-1/2 -translate-y-1/2 w-7 h-7 bg-white rounded-full shadow border border-slate-200 items-center justify-center z-10 hover:bg-slate-50"><i class="fa-solid fa-chevron-left text-[10px] text-[#1A56FF]"></i></button>'
        +'<button onclick="scrollRow(\'ebrow-'+slug+'\',240)" class="hidden sm:flex absolute -left-3.5 top-1/2 -translate-y-1/2 w-7 h-7 bg-white rounded-full shadow border border-slate-200 items-center justify-center z-10 hover:bg-slate-50" style="left:auto;right:-0.875rem"><i class="fa-solid fa-chevron-right text-[10px] text-[#1A56FF]"></i></button>'
        +'<div id="ebrow-'+slug+'" class="'+containerClass+'">'+cards+'</div></div>'+dots+'</section>';
    }).join('');
  }

  // --- Filtered results (?ebookBatch / ?category / ?q): grid section thakle okhane, nahole batch area-tei dekhao ---
  const filtered=listAll.filter(e=>ebMatchesParams(e,fBatch,fCat,fQ));
  if(gridEl){
    if(titleEl){
      if(fBatch||fCat) titleEl.textContent=(fBatch?fBatch+' ':'')+(fCat?('• '+fCat+' '):'')+'E-Books';
      else titleEl.textContent='All E-Books';
    }
    gridEl.innerHTML=filtered.length
      ? filtered.map(ebCard).join('')
      : '<p class="col-span-full text-[13px] text-slate-400 text-center py-8">No e-books found.</p>';
  } else if(isFiltered){
    secsEl.innerHTML=filtered.length
      ? '<div class="grid grid-cols-4 lg:grid-cols-5 gap-1.5 sm:gap-4 mt-3 sm:mt-5">'+filtered.map(ebCard).join('')+'</div>'
      : '<p class="text-[13px] text-slate-400 text-center py-8">No e-books found.</p>';
  }
}
document.addEventListener('DOMContentLoaded',loadEbookPage);
</script>
<script src="assets/navbar.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
