<script>
(function(){
  try{
    // Smart Account routing: guest -> auth page, logged-in -> dashboard
    var hasTok=function(){ try{return !!(localStorage.getItem('sm_user_token')||sessionStorage.getItem('sm_user_token'));}catch(x){return false;} };
    if(!hasTok()) document.querySelectorAll('[data-account-link]').forEach(function(a){ a.href='auth.html?next='+encodeURIComponent('dashboard.html'); });
  }catch(e){}
  // click-time re-check (token may change without reload)
  document.addEventListener('click',function(e){
    var a=e.target&&e.target.closest?e.target.closest('[data-account-link]'):null;
    if(!a) return;
    var t=''; try{t=localStorage.getItem('sm_user_token')||sessionStorage.getItem('sm_user_token')||'';}catch(x){}
    if(!t){ e.preventDefault(); location.href='auth.html?next='+encodeURIComponent('dashboard.html'); }
  });
})();
</script>

<script>
document.getElementById('menuBtn').addEventListener('click',()=>document.getElementById('mobileMenu').classList.toggle('hidden'));

/* ===== Dynamic batches + per-batch category summary (same design, live data) ===== */
function dynEsc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function batchIcon(b){
  const n=(b.name||'').toLowerCase();
  if(n.includes('skill')) return 'fa-briefcase';
  if(n.includes('ssc')) return 'fa-book-open';
  return 'fa-graduation-cap';
}
const CAT_STYLES=[
  {box:'cat-academic',icon:'fa-layer-group',iconCls:'text-[#3B5BFE]',pill:'bg-[#DDD6FE] text-[#4F46E5]',hover:'hover:bg-[#1A56FF]'},
  {box:'cat-revision',icon:'fa-bullseye',iconCls:'text-[#16A34A]',pill:'bg-[#C8E9D5] text-[#15803D]',hover:'hover:bg-[#16A34A]'},
  {box:'cat-admission',icon:'fa-building-columns',iconCls:'text-[#F59E0B]',pill:'bg-[#FFE4C7] text-[#C2410C]',hover:'hover:bg-[#F59E0B]'}
];
function catStyle(name,idx){
  const n=(name||'').toLowerCase();
  if(n.includes('academic')) return CAT_STYLES[0];
  if(n.includes('revision')) return CAT_STYLES[1];
  if(n.includes('admission')) return CAT_STYLES[2];
  return CAT_STYLES[idx%3];
}
function twoLine(name){
  const parts=String(name||'').split(' ');
  if(parts.length>1) return dynEsc(parts.slice(0,-1).join(' '))+'<br>'+dynEsc(parts[parts.length-1]);
  return dynEsc(name);
}
async function loadCoursePage(){
  const pillsEl=document.getElementById('batchPills');
  const secsEl=document.getElementById('batchSections');
  try{
    const unwrap=j=>Array.isArray(j)?j:(j&&Array.isArray(j.data)?j.data:[]);
    // instant: server-injected catalog (zero network), then background revalidate
    try {
      var __cc = window.__SM_BOOTSTRAP__ && window.__SM_BOOTSTRAP__.catalog;
      if (__cc && Array.isArray(__cc.batches) && Array.isArray(__cc.courses)) {
        paintAll(__cc.batches, __cc.categories || [], __cc.courses);
        var __ck = 'cat:' + __cc.batches.length + ':' + (__cc.categories || []).length + ':' + __cc.courses.length;
        if(pillsEl) pillsEl._smKey = __ck; if(secsEl) secsEl._smKey = __ck;
      }
    } catch (e) {}
    // fetch homepage for Category Tabs order/cols (so admin Position & Column affects courses.html too)
    try{
      const hj = await fetch('/api/public/homepage').then(r=>r.json());
      if(hj && hj.success && hj.data) window.__SM_HP__ = hj.data;
    }catch(e){}
    const [batches,cats,courses]=await Promise.all([
      fetch('/api/batches').then(r=>r.json()).then(unwrap),
      fetch('/api/categories').then(r=>r.json()).then(unwrap),
      fetch('/api/courses').then(r=>r.json()).then(unwrap)
    ]);
    var __k = 'cat:' + batches.length + ':' + (cats || []).length + ':' + courses.length + ':' + JSON.stringify((courses || []).slice(0, 20).map(c => c.id));
    var __need = (pillsEl ? pillsEl._smKey !== __k : false) || (secsEl ? secsEl._smKey !== __k : true);
    if (__need) paintAll(batches, cats, courses);
    if(pillsEl) pillsEl._smKey = __k; if(secsEl) secsEl._smKey = __k;
  }catch(e){
    if (pillsEl && !pillsEl._smKey) pillsEl.innerHTML='<p class="col-span-full text-[13px] text-red-400 text-center py-4">Failed to load batches</p>';
  }
}

function paintAll(batches, cats, courses){
  const pillsEl=document.getElementById('batchPills');
  const secsEl=document.getElementById('batchSections');
  if(!secsEl) return;
    const activeBatches=(Array.isArray(batches)?batches:[]).filter(b=>b.status!=='inactive'&&b.status!=='archived').sort((a,b)=>((Number(a.order)||999)-(Number(b.order)||999))||(Number(a.id)-Number(b.id)));
    const catById={};const catSlugById={};(Array.isArray(cats)?cats:[]).forEach(c=>{catById[c.id]=c.name||'General';catSlugById[c.id]=String(c.slug||c.name||'General').toLowerCase()});

    // --- Top pills removed ---

    // helper: per-batch category order/cols from Admin → Category Tabs (batch.html / courses.html both)
    function cfgForBatch(batch){
      try{
        var hp = (window.__SM_BOOTSTRAP__ && window.__SM_BOOTSTRAP__.homePage) || window.__SM_HP__ || null;
        var ct = hp && hp.sections ? hp.sections.categoryTabs : null;
        if(ct){
          var ord = Array.isArray(ct.tabOrder) && ct.tabOrder.length ? ct.tabOrder.map(function(s){ return String(s).toLowerCase(); }) : ['academic','admission','revision'];
          var cols = Math.min(6, Math.max(1, parseInt(ct.cols,10) || 5));
          var per = ct.perBatch || {};
          var bid = String(batch && batch.id || ''), bslug = String(batch && batch.slug || '').toLowerCase();
          var custom = (bid && per['c:'+bid]) || (bslug && per['c:'+bslug]) || (bid && per[bid]) || null;
          if(Array.isArray(custom) && custom.length) ord = custom.map(function(s){ return String(s).toLowerCase(); });
          return { order: ord, cols: cols };
        }
      }catch(e){}
      return { order: ['academic','admission','revision'], cols: 5 };
    }

    // --- Per-batch summary sections ---
    secsEl.innerHTML=activeBatches.map((b,bi)=>{
      const slug=dynEsc(b.slug||b.id);
      const list=(Array.isArray(courses)?courses:[]).filter(c=>String(c.batchId)===String(b.id)&&c.status!=='inactive');
      const groups={};const slugByName={};let order=[];
      list.forEach(c=>{
        const cn=catById[c.categoryId]||c.categoryName||'General';
        const cs=String(c.categorySlug||catSlugById[c.categoryId]||cn).toLowerCase();
        if(!groups[cn]){groups[cn]=0;order.push(cn);slugByName[cn]=cs}groups[cn]++});
      // apply Admin order (Position & Column) — same as batch.html
      const cfg = cfgForBatch(b);
      order.sort(function(a,b){
        var sa = String(slugByName[a]||a).toLowerCase(), sb = String(slugByName[b]||b).toLowerCase();
        var ia = cfg.order.indexOf(sa), ib = cfg.order.indexOf(sb);
        if(ia===-1 && ib===-1) return a.localeCompare(b);
        if(ia===-1) return 1;
        if(ib===-1) return -1;
        return ia-ib;
      });
      const cols = Math.max(1,Math.min(order.length||1, 5));
      const mCols = Math.max(1,Math.min(order.length||1, 4));


      const cards=order.length?order.map((cn,ci)=>{
        const st=catStyle(cn,ci);
        const catParam=encodeURIComponent(slugByName[cn]||String(cn).toLowerCase());
        return `<a href="batch.html?batch=${slug}&category=${catParam}" class="group ${st.box} rounded-[10px] sm:rounded-[18px] p-1.5 sm:p-5 flex flex-col items-center justify-center text-center transition-all duration-200 active:scale-[0.98] hover:shadow-lg hover:-translate-y-1 hover:ring-2 hover:ring-[#1A56FF]/20 w-full min-h-[76px] sm:min-h-[140px]">
          <div class="w-7 h-7 sm:w-12 sm:h-12 rounded-xl bg-white flex items-center justify-center shadow-sm ring-1 ring-black/5 group-hover:scale-110 transition-transform">
            <i class="fa-solid ${st.icon} ${st.iconCls} text-[12px] sm:text-[22px]"></i>
          </div>
          <h3 class="mt-1 sm:mt-2 font-extrabold text-[9px] sm:text-[14px] leading-snug text-[#0F2043] line-clamp-2">
            ${dynEsc(cn)}
          </h3>
        </a>`;
      }).join(''):`<p class="col-span-full text-[12px] text-slate-400 py-4 text-center">No courses in this batch yet</p>`;

      const containerClass = `grid grid-cols-${mCols} sm:grid-cols-${cols} gap-2 sm:gap-4`;

      return `<section id="batch-${slug}" class="${bi===0?'mt-3 sm:mt-5':'mt-3 sm:mt-4'} bg-white rounded-[16px] border border-slate-100/90 shadow-xs p-2.5 sm:p-4">
        <div class="flex items-center justify-between mb-2 sm:mb-3">
          <div class="flex items-center gap-2 sm:gap-2.5">
            <div class="w-7 h-7 sm:w-9 sm:h-9 rounded-full bg-[#EEF2FF] flex items-center justify-center flex-shrink-0">
              <i class="fa-solid ${batchIcon(b)} text-[#3B5BFE] text-[13px] sm:text-[16px]"></i>
            </div>
            <h2 class="text-[15px] sm:text-[19px] font-extrabold text-[#0F2043]">${dynEsc(b.name||'Batch')}</h2>
          </div>
          <a href="batch.html?batch=${slug}" class="text-[#1A56FF] font-bold text-[11px] sm:text-[13px] flex items-center gap-1 hover:underline">View All <i class="fa-solid fa-arrow-right text-[10px]"></i></a>
        </div>
        <div id="row-${slug}" class="${containerClass}">${cards}</div>
      </section>`;
    }).join('');
}
document.addEventListener('DOMContentLoaded',loadCoursePage);
</script>
